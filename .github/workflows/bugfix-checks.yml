name: Naming and family regression checks
on:
  pull_request:
    branches: [enhanced-development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Generate MonoGame projects
        shell: pwsh
        run: |
          Set-Location FreeSO/Other/libs/FSOMonoGame
          ./protobuild.exe --generate
      - name: Build Windows Release
        run: dotnet build Client/Simitone/Simitone.Windows/Simitone.Windows.csproj -c Release
      - name: Build and run naming dialog regressions
        run: dotnet run --project Tests/Simitone.Dialog.Tests -c Release
      - name: Build and run family persistence regressions
        run: dotnet run --project Tests/Simitone.Family.Tests -c Release
